replicaCount: 2

image:
  backend:
    repository: ghcr.io/soleilbrulant/capstone-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/soleilbrulant/capstone-frontend
    tag: latest
    pullPolicy: IfNotPresent

service:
  backendPort: 8000
  frontendPort: 80

ingress:
  enabled: true
  host: devops-capstone.local

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

resources:
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
