apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/soleilbrulant/DevOps_Homework.git'
    targetRevision: HEAD
    path: final-devops-project/kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
