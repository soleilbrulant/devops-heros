apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devops-production
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "devops_user"
            - name: POSTGRES_PASSWORD
              value: "devops_secure_password"
            - name: POSTGRES_DB
              value: "capstone_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: devops-production
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
